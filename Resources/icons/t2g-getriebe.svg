<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Getriebe bauen</title>
  <rect x="1" y="1" width="30" height="30" rx="5" fill="#2a2140" stroke="#150f22" stroke-width="1"/>
  <!-- zwei kaemmende Zahnraeder: das grosse links, das kleine rechts -->
  <g stroke="#b9a7f0" fill="none" stroke-width="1.8" stroke-linejoin="round">
    <circle cx="12" cy="16" r="7"/>
    <circle cx="24" cy="16" r="4"/>
  </g>
  <g fill="#b9a7f0">
    <rect x="11" y="7" width="2" height="3"/>
    <rect x="11" y="22" width="2" height="3"/>
    <rect x="3" y="15" width="3" height="2"/>
    <rect x="18" y="15" width="3" height="2"/>
    <rect x="23" y="10" width="2" height="2.6"/>
    <rect x="23" y="19.4" width="2" height="2.6"/>
    <rect x="27.6" y="15" width="2.6" height="2"/>
  </g>
  <!-- Wellen -->
  <g fill="#7c63d6">
    <circle cx="12" cy="16" r="2.4"/>
    <circle cx="24" cy="16" r="1.8"/>
  </g>
</svg>
