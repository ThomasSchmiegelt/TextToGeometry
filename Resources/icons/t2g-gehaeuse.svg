<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Gehaeuse bauen</title>
  <rect x="1" y="1" width="30" height="30" rx="5" fill="#3a2a14" stroke="#20170a" stroke-width="1"/>
  <!-- Konturgehaeuse: zwei Kreise, verschmolzen, geteilt -->
  <path d="M6 10 A6 6 0 0 1 18 10 A9 9 0 0 1 28 13 L28 19 A9 9 0 0 1 18 22
           A6 6 0 0 1 6 22 Z"
        fill="none" stroke="#f0c987" stroke-width="2" stroke-linejoin="round"/>
  <!-- Trennebene durch beide Wellenachsen -->
  <path d="M3 16 h26" stroke="#c98f2f" stroke-width="1.6" stroke-dasharray="3 2"/>
  <!-- Wellenachsen -->
  <g fill="#c98f2f">
    <circle cx="10" cy="16" r="1.8"/>
    <circle cx="22" cy="16" r="1.8"/>
  </g>
  <!-- Flanschschrauben -->
  <g fill="#f0c987">
    <circle cx="4.5" cy="16" r="1.1"/>
    <circle cx="27.5" cy="16" r="1.1"/>
  </g>
</svg>
