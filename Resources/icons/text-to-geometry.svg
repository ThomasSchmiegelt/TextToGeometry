<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>Text to Geometry</title>
  <rect x="1" y="1" width="30" height="30" rx="5" ry="5" fill="#1e3a5f"/>
  <rect x="1" y="1" width="30" height="30" rx="5" ry="5" fill="none" stroke="#0f2438" stroke-width="1"/>
  <!-- isometric cube: top face -->
  <polygon points="8,13 16,9 24,13 16,17" fill="#7ec8ff"/>
  <!-- front face -->
  <polygon points="8,13 16,17 16,25 8,21" fill="#4a9fdc"/>
  <!-- right face -->
  <polygon points="16,17 24,13 24,21 16,25" fill="#2b6cb0"/>
  <!-- spark (LLM) -->
  <circle cx="24" cy="8" r="2.5" fill="#ffd23f"/>
  <circle cx="24" cy="8" r="4" fill="#ffd23f" opacity="0.35"/>
</svg>
